apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sqlserver
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "greenfinance.labels" . | nindent 4 }}
spec:
  serviceName: sqlserver
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: greenfinance-db-secret
                  key: SA_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
          # $(VAR) substitution only applies to container command/args, NOT to
          # probe exec commands — passing "$(MSSQL_SA_PASSWORD)" directly as an
          # argument sends that literal string to sqlcmd as the password. Route
          # through a real shell instead, which expands $MSSQL_SA_PASSWORD from
          # its own inherited process environment.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
            initialDelaySeconds: 20
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
            initialDelaySeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.sqlserver.storageClassName }}
        storageClassName: {{ .Values.sqlserver.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.sqlserver.storage }}

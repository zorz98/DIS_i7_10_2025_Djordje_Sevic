# Copy of deploy/grafana/provisioning/dashboards/dashboards.yml for the
# Kubernetes Helm chart — keep both in sync.
apiVersion: 1

providers:
  - name: GreenFinance
    orgId: 1
    folder: GreenFinance
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore GreenFinance.slnx

      - name: Build
        run: dotnet build GreenFinance.slnx --no-restore -c Release

      - name: Unit tests
        run: >
          dotnet test GreenFinance.slnx --no-build -c Release
          --filter "FullyQualifiedName~UnitTests"
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory ./TestResults

      - name: Integration tests
        run: >
          dotnet test GreenFinance.slnx --no-build -c Release
          --filter "FullyQualifiedName~IntegrationTests"
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      matrix:
        service:
          - name: reference-data-service
            dockerfile: src/Services/ReferenceDataService/ReferenceDataService.Api/Dockerfile
          - name: transaction-service
            dockerfile: src/Services/TransactionService/TransactionService.Api/Dockerfile
          - name: esg-service
            dockerfile: src/Services/ESGService/ESGService.Api/Dockerfile
          - name: report-service
            dockerfile: src/Services/ReportService/ReportService.Api/Dockerfile
          - name: notification-service
            dockerfile: src/Services/NotificationService/NotificationService.Api/Dockerfile
          - name: api-gateway
            dockerfile: src/ApiGateway/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.service.name }} image
        run: docker build -f ${{ matrix.service.dockerfile }} -t greenfinance/${{ matrix.service.name }}:${{ github.sha }} .
